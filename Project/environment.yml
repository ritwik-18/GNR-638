name: gnr_project_env
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    # torch is NOT here — installed separately in setup.bash with CUDA index URL
    # mixing PyPI torch with torchvision causes torchvision::nms runtime error
    - git+https://github.com/huggingface/transformers
    - accelerate>=0.34.0
    - qwen-vl-utils
    - Pillow
    - pandas
    - huggingface_hub
    - sentencepiece
    - tiktoken
    - einops
