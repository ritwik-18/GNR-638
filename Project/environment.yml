name: map_mcq_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - cudatoolkit=11.8

  - pip:
    # Core deep learning
    - torch==2.3.1
    - torchvision==0.18.1
    - torchaudio==2.3.1
    - transformers==4.44.2
    - accelerate==0.33.0
    - sentencepiece==0.2.0
    - tiktoken==0.7.0
    - einops==0.8.0

    # Qwen2-VL specific
    - qwen-vl-utils==0.0.8
    - flash-attn==2.6.3       # compiled for L40s; remove if CUDA version mismatch

    # Computer vision
    - opencv-python==4.10.0.84
    - Pillow==10.4.0

    # Data handling
    - pandas==2.2.2
    - numpy==1.26.4

    # Notebook runtime
    - notebook==7.2.1
    - ipykernel==6.29.5
    - tqdm==4.66.4
