name: gnr_project_env
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    # torch/torchvision/torchaudio are NOT here
    # They are installed separately in setup.bash with:
    #   pip install --force-reinstall torch torchvision torchaudio
    #       --index-url https://download.pytorch.org/whl/cu126
    # Installing torch from here (PyPI) causes:
    #   RuntimeError: operator torchvision::nms does not exist
    - git+https://github.com/huggingface/transformers
    - accelerate>=0.34.0
    - qwen-vl-utils
    - Pillow
    - pandas
    - huggingface_hub
    - sentencepiece
    - tiktoken
    - einops
